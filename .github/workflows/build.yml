# .github/workflows/build.yml
name: Build Windows EXE

# 指定触发时机：当你向 main 分支推送代码时，或手动触发时
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    # 指定运行环境为 Windows，这样打出的包才是 .exe
    runs-on: windows-latest

    steps:
      # 1. 拉取你的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装依赖 (读取你上传的 requirements.txt)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 用 PyInstaller 打包 (这里以 fund.py 为例)
      - name: Package with PyInstaller
        run: |
          pyinstaller --onefile --hidden-import=DrissionPage fund.py

      # 5. 把生成的 .exe 文件作为“制品”上传，供你下载
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fund-windows-exe
          path: dist/fund.exe
